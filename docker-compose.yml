services:
  postgres_db:
    image: postgres:16-alpine
    env_file: .env
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      retries: 30

  ingestion:
    build: ./1_ingestion
    env_file: .env
    environment:                  
      DATALAKE_DIR: /data
      POSTGRES_HOST: postgres_db   
    volumes:
      - ./2_datalake:/data    
    depends_on:
      postgres_db:
        condition: service_healthy
    restart: "no"

  dbt:
    build: ./3_dbt_transformation
    env_file: .env
    environment:
      POSTGRES_HOST: postgres_db
    ports: ["8080:8080"]          # documentation dbt : http://localhost:8080
    depends_on:
      ingestion:
        condition: service_completed_successfully
    restart: "no"

volumes:
  postgres_data: