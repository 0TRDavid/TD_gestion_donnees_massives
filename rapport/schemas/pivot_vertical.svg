<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 230" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="920" height="230" fill="#ffffff"/>
  <text x="10" y="20" font-weight="bold" fill="#334155">Format vertical (raw / staging) : tout est texte — exemple illustratif</text>
  <g font-family="Consolas, monospace" font-size="11.5">
    <rect x="10" y="30" width="390" height="22" fill="#10b981"/>
    <text x="18" y="46" fill="#fff" font-weight="bold">OBJET_ID</text><text x="120" y="46" fill="#fff" font-weight="bold">COLONNE</text><text x="300" y="46" fill="#fff" font-weight="bold">VALEUR</text>
    <g fill="#1e293b">
      <rect x="10" y="52" width="390" height="150" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="18" y="70">a3f9…</text><text x="120" y="70">nom_entreprise</text><text x="300" y="70">Decathlon</text>
      <text x="18" y="90">a3f9…</text><text x="120" y="90">note_globale</text><text x="300" y="90">4,1</text>
      <text x="18" y="110">a3f9…</text><text x="120" y="110">taux_recommandation</text><text x="300" y="110">0,82</text>
      <text x="18" y="130">a3f9…</text><text x="120" y="130">note_lieu</text><text x="300" y="130">-0,1</text>
      <text x="18" y="150">a3f9…</text><text x="120" y="150">annee_creation</text><text x="300" y="150">1976</text>
      <text x="18" y="170">b71c…</text><text x="120" y="170">nom_entreprise</text><text x="300" y="170">Atos</text>
      <text x="18" y="190">…</text><text x="120" y="190">…</text><text x="300" y="190">…</text>
    </g>
  </g>

  <path d="M410,120 L500,120" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#f)"/>
  <text x="455" y="104" text-anchor="middle" font-weight="bold" fill="#7c3aed">pivot</text>
  <text x="455" y="140" text-anchor="middle" font-size="10.5" fill="#64748b">max(case when…)</text>
  <text x="455" y="154" text-anchor="middle" font-size="10.5" fill="#64748b">+ typage</text>

  <text x="510" y="20" font-weight="bold" fill="#334155">Format horizontal typé (intermediate)</text>
  <g font-family="Consolas, monospace" font-size="11.5">
    <rect x="510" y="30" width="400" height="22" fill="#7c3aed"/>
    <text x="516" y="46" fill="#fff" font-weight="bold">nom</text><text x="600" y="46" fill="#fff" font-weight="bold">note</text><text x="660" y="46" fill="#fff" font-weight="bold">taux_reco</text><text x="750" y="46" fill="#fff" font-weight="bold">note_lieu</text><text x="840" y="46" fill="#fff" font-weight="bold">année</text>
    <rect x="510" y="52" width="400" height="60" fill="#faf5ff" stroke="#ddd6fe"/>
    <text x="516" y="72">Decathlon</text><text x="600" y="72">4.1</text><text x="660" y="72">0.82</text><text x="750" y="72" fill="#dc2626">NULL</text><text x="840" y="72">1976</text>
    <text x="516" y="96">Atos</text><text x="600" y="96">…</text><text x="660" y="96">…</text><text x="750" y="96">…</text><text x="840" y="96">…</text>
  </g>
  <g font-size="11" fill="#475569">
    <text x="510" y="136">text → numeric : virgule décimale remplacée, valeur contrôlée par regex</text>
    <text x="510" y="154">valeurs factices Glassdoor (0, -0,1, -1) → NULL (macro vers_note)</text>
    <text x="510" y="172">un attribut absent de la page → NULL, sans erreur</text>
    <text x="510" y="190">une ligne par objet, une colonne par attribut</text>
  </g>
</svg>
